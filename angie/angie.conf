load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # --- Сжатие ---
    gzip on;
    gzip_comp_level 3;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    brotli on;
    brotli_comp_level 4;
    brotli_min_length 1000;
    brotli_types text/plain text/css text/xml application/javascript application/json image/svg+xml image/x-icon;

    zstd on;
    zstd_comp_level 5;
    zstd_min_length 1000;
    zstd_types text/plain text/css text/xml application/javascript application/json image/svg+xml image/x-icon;

    # --- Лимиты ---
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    # --- Блокировка ботов ---
    map $http_user_agent $limit_bots {
        default 0;
        ~*(libwww|Python|perl|urllib|PycURL|Pyth|webcraw) 1;
    }

    upstream backend {
        server backend:5050;
    }

    upstream webrtc {
        server webrtc:5000;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream minio {
        server minio:9000;
    }

    map $remote_addr $is_internal {
        default 0;
        ~^172\. 1;
        ~^10\. 1;
        ~^192\.168\. 1;
    }

    map $http_x_forwarded_for $is_from_frontend {
        default 0;
        ~^172\. 1;
        ~^10\. 1;
        ~^192\.168\. 1;
    }

    # Старый домен → канонический на vondic.ru
    map $host $canonical_host {
        default $host;
        vondic.knopusmedia.ru vondic.ru;
        api.vondic.knopusmedia.ru api.vondic.ru;
        webrtc.vondic.knopusmedia.ru webrtc.vondic.ru;
        in.api.vondic.knopusmedia.ru in.api.vondic.ru;
        in.webrtc.vondic.knopusmedia.ru in.webrtc.vondic.ru;
    }

    # Секрет прокси Next.js → api/webrtc (должен совпадать с VONDIC_PROXY_SECRET в compose)
    map $http_x_vondic_proxy_secret $is_vondic_proxy {
        default 0;
        "vondic-dev-proxy-secret" 1;
    }

    # HTTP: старые хосты → HTTPS на vondic.ru
    server {
        listen 80;
        server_name vondic.knopusmedia.ru api.vondic.knopusmedia.ru webrtc.vondic.knopusmedia.ru in.api.vondic.knopusmedia.ru in.webrtc.vondic.knopusmedia.ru;
        return 301 https://$canonical_host$request_uri;
    }

    # HTTP: новые хосты → HTTPS
    server {
        listen 80;
        server_name vondic.ru api.vondic.ru webrtc.vondic.ru s3.vondic.ru in.api.vondic.ru in.webrtc.vondic.ru call.vondic.ru;
        return 301 https://$host$request_uri;
    }

    # HTTPS: редирект со старого домена
    server {
        listen 443 ssl;
        server_name vondic.knopusmedia.ru api.vondic.knopusmedia.ru webrtc.vondic.knopusmedia.ru in.api.vondic.knopusmedia.ru in.webrtc.vondic.knopusmedia.ru;

        ssl_certificate /etc/angie/ssl/vondic.ru.crt;
        ssl_certificate_key /etc/angie/ssl/vondic.ru.key;

        return 301 https://$canonical_host$request_uri;
    }

    # Frontend — vondic.ru
    server {
        listen 443 ssl;
        server_name vondic.ru;

        ssl_certificate /etc/angie/ssl/vondic.ru.crt;
        ssl_certificate_key /etc/angie/ssl/vondic.ru.key;

        if ($limit_bots = 1) {
            return 444;
        }

        limit_req zone=general burst=200 nodelay;
        limit_req_status 429;
        limit_conn connlimit 100;

        location /api/public/v1/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        location /socket.io/ {
            proxy_pass http://webrtc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # WebRTC REST API для desktop/mobile
        location ~ ^/(messages|channels|chats|groups)(/|$) {
            proxy_pass http://webrtc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /set_socket_id {
            proxy_pass http://webrtc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /get_socket_id/ {
            proxy_pass http://webrtc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/online-users {
            proxy_pass http://webrtc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API Backend — api.vondic.ru
    server {
        listen 443 ssl;
        server_name api.vondic.ru;

        ssl_certificate /etc/angie/ssl/vondic.ru.crt;
        ssl_certificate_key /etc/angie/ssl/vondic.ru.key;

        if ($limit_bots = 1) {
            return 444;
        }

        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        limit_conn connlimit 100;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # WebRTC Signaling Server — webrtc.vondic.ru
    server {
        listen 443 ssl;
        server_name webrtc.vondic.ru;

        ssl_certificate /etc/angie/ssl/vondic.ru.crt;
        ssl_certificate_key /etc/angie/ssl/vondic.ru.key;

        if ($limit_bots = 1) {
            return 444;
        }

        location /socket.io/ {
            proxy_pass http://webrtc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://webrtc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # S3 Object Storage — s3.vondic.ru
    server {
        listen 443 ssl;
        server_name s3.vondic.ru;

        ssl_certificate /etc/angie/ssl/vondic.ru.crt;
        ssl_certificate_key /etc/angie/ssl/vondic.ru.key;

        if ($limit_bots = 1) {
            return 444;
        }

        # Для pre-signed URL и API-запросов
        client_max_body_size 50M;
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://minio;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Host $host;
            proxy_redirect ~^http://[^/]+/(.*)$ https://s3.vondic.ru/$1;
            proxy_redirect default;

            # Для загрузки файлов
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
        }
    }
}
