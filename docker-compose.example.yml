services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ...
      POSTGRES_PASSWORD: ..
      POSTGRES_DB: ...
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vondic -d vondic']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - app-network
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ...
      RABBITMQ_DEFAULT_PASS: ...
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=...
      - DB_PASSWORD=...
      - DB_NAME=...
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
      - SERVER_RESET_QUERY="DISCARD ALL"
      - ADMIN_USERS=postgres,admin
    ports:
      - '6432:6432'
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    env_file:
      - ./backend/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - '5050:5050'
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=...
      - S3_SECRET_KEY=...
      - S3_BUCKET=uploads
      - S3_REGION=us-east-1
      - S3_PUBLIC_URL=https://s3.vondic.ru
      - MAIL_CREDENTIALS_KEY=...
    networks:
      - app-network
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ...
      MINIO_ROOT_PASSWORD: ...
    command: server --console-address ":9001" /data
    expose:
      - '9000'
      - '9001'
    ports:
      - '9001:9001'
    networks:
      - app-network

  # videochecker:  # temporarily disabled to save disk space (~8 GB of analysis packages)
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile.videochecker
  #   container_name: videochecker
  #   env_file:
  #     - ./backend/.env.backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     pgbouncer:
  #       condition: service_started
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   networks:
  #     - app-network
  #   restart: unless-stopped

  gamescanner:
    build:
      context: .
      dockerfile: backend/Dockerfile.gamescanner
    container_name: gamescanner
    env_file:
      - ./backend/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  webrtc:
    build:
      context: .
      dockerfile: webrtc/Dockerfile.webrtc
    container_name: webrtc
    env_file:
      - ./webrtc/.env.webrtc
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - '5000:5000'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
      - webrtc
    networks:
      - app-network
    ports:
      - '3000:3000'
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: bot
    env_file:
      - ./bot/.env.bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  notification-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: vondic-notification-worker
    command: python notification_worker.py
    env_file:
      - ./backend/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  angie:
    build: ./nginx
    container_name: angie
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/ssl:/etc/angie/ssl:ro
      - ./angie/angie.conf:/etc/angie/angie.conf:ro
    depends_on:
      - backend
      - webrtc
      - frontend
      - minio
    networks:
      - app-network
    restart: unless-stopped

  turn:
    image: coturn/coturn
    container_name: turn
    restart: unless-stopped
    ports:
      - '3478:3478'
      - '3478:3478/udp'
      - '50000-50050:50000-50050'
      - '50000-50050:50000-50050/udp'
    command: >
      -n --log-file=stdout
      --min-port=50000 --max-port=50050
      --user=...:...
      --realm=...
      --listening-port=3478
      --listening-ip=0.0.0.0
      --external-ip=...
      --fingerprint
      --lt-cred-mech
      --no-cli
      --no-tls
      --no-dtls
    networks:
      - app-network

  backup:
    image: postgres:15
    container_name: vondic-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ...
    volumes:
      - ${HOME}/backups:/backups
    entrypoint: >
      sh -c "while true; do
        DATE=$$(date +%Y-%m-%d_%H-%M-%S);
        echo \"[$$DATE] Starting backup...\";
        pg_dump -h postgres -U vondic -d vondic --no-owner --no-acl | gzip > /backups/vondic_$$DATE.sql.gz;
        SIZE=$$(du -h /backups/vondic_$$DATE.sql.gz | cut -f1);
        echo \"[$$DATE] Backup completed: vondic_$$DATE.sql.gz ($$SIZE)\";
        find /backups -name 'vondic_*.sql.gz' -mtime +7 -delete 2>/dev/null;
        echo \"[$$DATE] Old backups (>7 days) cleaned\";
        sleep 86400;
      done"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  app-network:
    driver: bridge
